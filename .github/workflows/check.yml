name: Check source release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ganymede-ui/package-lock.json
      - run: pip install -r ganymede-backend/requirements.txt
      - run: python -m compileall -q ganymede-backend/app
      - run: python -m unittest discover -s ganymede-backend/tests -v
      - run: python -m unittest discover -s scripts/tests -v
      - run: npm ci
        working-directory: ganymede-ui
      - run: npm test
        working-directory: ganymede-ui
      - run: npm run build
        working-directory: ganymede-ui
      - run: npm run build:showcase
        working-directory: ganymede-ui
