name: Bug report
description: Report a reproducible problem in the public demonstration.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How can we reproduce it?
      description: Include the scenario, browser, and exact steps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
      description: Screenshots and accessibility details are welcome.

